[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxpatcher"
version = "0.1.0"
description = "A Python-based Builder for Max/MSP patches using Context7 intelligence."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22.0",
    "tabulate",
    "click",
]

[project.scripts]
maxpatcher = "maxpatcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["maxpatcher*"]
